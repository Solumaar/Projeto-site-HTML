<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Novo Usuário</title>

    <style>

        /* Animação do campo de e-mail sendo verificado*/
        #email {
            transition: 0.3s;
        }
        #email:hover {
            transform: scale(1.08);
            background-color: #eeeeee;
        }
        /* Mensagem que aparece depois do cadastro realizado */
        #mensagem {
            display: none;
            color: rgb(33, 21, 207);
            font-weight: bold;
            text-align: center;
        }

    </style>
</head>

<body>

    <center>
        <h1>Novo Usuário</h1>
    </center>

    <form action="TelaPrincipal.html" method="get" onsubmit="criarConta(event)">
        <table border="5" width="340" height="180" align="center">
            <tr>
                <td>

                    <table>
                        <tr>
                            <td>
                                <label for="nome">Nome:</label>
                                <input type="text" id="nome" name="nome">
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="email">E-mail:</label>
                                <input type="email" id="email" name="email">
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <br>

                                <label for="observacoes">Observações:</label>
                                <input type="text" id="observacoes" name="observacoes">

                            </td>
                        </tr>

                        <tr>
                            <td>
                                <br>
                                <label for="senha">Senha:</label>
                                <input type="password" id="senha" name="senha">
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="confirmar">Confirmar Senha:</label>
                                <input type="password" id="confirmar" name="confirmar">
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <fieldset>

                                    <legend>Sexo:</legend>

                                    <input type="radio" id="feminino" name="sexo" value="Feminino">
                                    <label for="feminino">Feminino</label>
                                    <input type="radio" id="masculino" name="sexo" value="Masculino">
                                    <label for="masculino">Masculino</label>
                                </fieldset>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <center>
                                    <input type="submit" value="Cadastrar">
                                    <input type="reset" value="Limpar">
                                </center>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <p id="mensagem">
                                     Senha enviada para confirmação de conta
                                </p>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </form>

    <script>

        function criarConta(event) {

            event.preventDefault();
            var email = document.getElementById("email").value;

            /* Verifica se o e-mail foi informado de forma válida, e sim, tambem copiei do careca do youtube*/
            if (email == "") {
                alert("Informe seu e-mail antes de continuar.");
                return;
            }
            document.getElementById("mensagem").style.display = "block";

            setTimeout(function() {

                window.location.href = "TelaPrincipal.html";

            }, 3000);

        }

    </script>
</body>
</html>
