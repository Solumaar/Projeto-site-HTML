<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Novo Usuário</title>

    <link rel="stylesheet" href="../CSS/NvUsuario.css">
   
</head>

<body>

    <center>
        <h1>Novo Usuário</h1>
    </center>
     <script src="../javaScript/NvUsuario.js" defer></script>

    <form action="TelaPrincipal.html" method="get" onsubmit="criarConta(event)">
        <table border="5" width="340" height="180" align="center">
            <tr>
                <td>

                    <table>
                        <tr>
                            <td>
                                <label for="nome">Nome:</label>
                                <input type="text" id="nome" name="nome">
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="email">E-mail:</label>
                                <input type="email" id="email" name="email">
                            </td>
                        </tr>


                        <tr>
                            <td>
                                <br>
                                <label for="senha">Senha:</label>
                                <input type="password" id="senha" name="senha">
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="confirmar">Confirmar Senha:</label>
                                <input type="password" id="confirmar" name="confirmar">
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <fieldset>

                                    <legend>Sexo:</legend>

                                    <input type="radio" id="feminino" name="sexo" value="Feminino">
                                    <label for="feminino">Feminino</label>
                                    <input type="radio" id="masculino" name="sexo" value="Masculino">
                                    <label for="masculino">Masculino</label>
                                </fieldset>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <center>
                                    <input type="submit" value="Cadastrar">
                                    <input type="reset" value="Limpar">
                                </center>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <p id="mensagem">
                                     Senha vai ser enviada para confirmação de conta
                                </p>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
