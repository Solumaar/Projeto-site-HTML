<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Senha</title>
    <script src="../javaScript/RpSenha.js" ></script>
    <link rel="stylesheet" href="../CSS/RpSenha.css">
</head>

<body>
    <center>
        <h1>Recuperar Senha</h1>
    </center>

    

    <table border="5" width="300" height="180" align="center">
        <tr>
            <td>
                <form onsubmit="enviarSenha(event)">
                    <table align="center">
                        <tr>
                            <td>
                                <label for="email"> E-mail: </label>
                            </td>

                            <td>
                                <input type="email" id="email" name="email">
                            </td>
                        </tr>

                        <tr>
                            <td colspan="2">

                                    <center>
                                        <br>
                                            <input type="submit" id="enviar" value="Enviar">

                                    </center>
                            </td>
                        </tr>
                    </table>
                </form>
            </td>
        </tr>
    </table>

</body>
</html>
