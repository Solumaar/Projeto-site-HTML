<!DOCTYPE html>
<html lang="pt-BR">
    
<head>
    <meta charset="UTF-8">

    <title>Tela de Login</title>


</head>
<body>

    <center>

        <h1>Loja jogo Xbox</h1>

    </center>


    <link rel="stylesheet" href="../css/styleindex.css">
    <script src="../javaScript/indexverificação.js"></script>
    <img src="../Projeto HTML/" alt="">

  
    <table border="4" width="300" height="240" align="center">
        <tr>
            <td>
                <form action="TelaPrincipal.html" method="get" onsubmit="verificarLogin(event)">
                    <table align="center">
                        <tr>

                            <td>
                                <label for="usuario">Usuário</label>
                            </td>

                            <td>
                                <input type="text" id="usuario" name="usuario">
                            </td>
                        </tr>


                        <tr>
                            <td>
                                <label for="senha">Senha</label>
                            </td>

                            <td>
                                <input type="password" id="senha" name="senha">
                            </td>
                        </tr>


                        <tr>
                            <td colspan="2" align="center">

                                <br>

                                <p>
                                    <input type="submit" value="Entrar">
                                </p>
                            </td>
                        </tr>

                    </table>

                    <p align="center">
                        <a href="NovoUsuario.html"> Novo Usuário </a>
                    </p>

                    <p align="center">
                        <a href="RecuperarSenha.html"> Esqueceu a senha? </a>
                    </p>
                </form>
            </td>
        </tr>
    </table>

</body>
</html>
