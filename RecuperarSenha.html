<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Senha</title>

    <style>

        /* Animação do campo de e-mail, a pesar que essa porcaria nao ser do jeito que eu quis */
        #email {
            transition: 0.3s;
        }
        #email:hover {
            transform: scale(1.08);
            background-color: #eeeeee;
        }
        /* Mensagem "Senha enviada" */
        #mensagem {
            display: none;
            color: rgb(8, 4, 238);
            font-weight: bold;
        }

    </style>
</head>

<body>
    <center>
        <h1>Recuperar Senha</h1>
    </center>

    <table border="5" width="300" height="180" align="center">
        <tr>
            <td>
                <form onsubmit="enviarSenha(event)">
                    <table align="center">
                        <tr>
                            <td>
                                <label for="email"> E-mail: </label>
                            </td>

                            <td>
                                <input type="email" id="email" name="email">
                            </td>
                        </tr>

                        <tr>
                            <td colspan="2">

                                    <center>
                                        <br>
                                            <input type="submit" id="enviar" value="Enviar">

                                    </center>
                            </td>
                        </tr>

                        <tr>
                            <td colspan="2">
                                <center>
                                    <p id="mensagem"> Senha enviada </p>
                                </center>
                            </td>
                        </tr>

                        <tr>
                            <td colspan="2">
                                <center>
                                    <br>
                                    <a
                                        href="index.html"  onclick="verificarEmail(event)"> Voltar para o Login </a>
                                </center>
                            </td>
                        </tr>
                    </table>
                </form>
            </td>
        </tr>
    </table>


    <script>
        /* 
           1 - Verifica quando  o e-mail é colocando, quando clicar no botao "Enviar", mostra uma alerta "Senha enviada". E infelizzmente tive que copiar do youtube*/
        function enviarSenha(event) {
            event.preventDefault();
            var email = document.getElementById("email").value;
            if (email == "") {

                alert("Informe seu e-mail para recuperar a senha.");

                return;
            }
            document.getElementById("mensagem").style.display = "block";
        }


        /* Verificaçao do e-mail, caso o email nao seja digitado e o usuário tentar ir para outra página, vai dar error.*/  

        function verificarEmail(event) {

            var email = document.getElementById("email").value;
            if (email == "") {
                event.preventDefault();

                alert("Informe seu e-mail antes de continuar.");
            }

        }

    </script>
</body>
</html>
